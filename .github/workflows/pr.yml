name: "Pull request checks"

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  syntax:
    name: "Ansible syntax check"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Check out repository and shared tasks"
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
        with:
          submodules: "recursive"
      - name: "Set up isolated Python environment"
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.12"
      - name: "Install Ansible"
        run: |
          python -m pip install \
            "ansible-core==2.21.3"
      - name: "Run syntax check"
        run: >-
          ansible-playbook --syntax-check
          -i docs/inventory-example.yml docs/playbook-example.yml
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/.."

  lint:
    name: "Production-profile Ansible Lint"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - name: "Check out repository and shared tasks"
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
        with:
          submodules: "recursive"
      - name: "Set up isolated Python environment"
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.12"
      - name: "Install Ansible Lint"
        run: |
          python -m pip install \
            "ansible-core==2.21.3" \
            "ansible-lint==26.8.0"
      - name: "Run production-profile lint"
        run: "ansible-lint --profile production"
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/.."

  validation:
    name: "Molecule validation"
    runs-on: "ubuntu-latest"
    timeout-minutes: 25
    steps:
      - name: "Check out repository and shared tasks"
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
        with:
          submodules: "recursive"
      - name: "Install Podman"
        run: "sudo apt-get update && sudo apt-get install --yes podman"
      - name: "Set up isolated Python environment"
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.12"
      - name: "Install Molecule and Ansible dependencies"
        run: |
          python -m pip install \
            "ansible-core==2.21.3" \
            "molecule==26.8.0" \
            "molecule-plugins[podman]==26.7.15"
      - name: "Install required Ansible collections"
        run: "ansible-galaxy collection install -r molecule/default/collections.yml"
      - name: "Run validation scenario"
        run: "molecule test -s validation"
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/.."

  baseline:
    name: "Molecule baseline (Rocky Linux 9)"
    runs-on: "ubuntu-latest"
    timeout-minutes: 35
    steps:
      - name: "Check out repository and shared tasks"
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
        with:
          submodules: "recursive"
      - name: "Install Podman"
        run: "sudo apt-get update && sudo apt-get install --yes podman"
      - name: "Set up isolated Python environment"
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.12"
      - name: "Install Molecule and Ansible dependencies"
        run: |
          python -m pip install \
            "ansible-core==2.21.3" \
            "molecule==26.8.0" \
            "molecule-plugins[podman]==26.7.15"
      - name: "Install required Ansible collections"
        run: "ansible-galaxy collection install -r molecule/default/collections.yml"
      - name: "Run Rocky Linux 9 baseline scenario"
        run: "molecule test -s default"
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/.."
