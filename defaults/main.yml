---
###############################################################################
#
# DEFAULT CONFIGURATION FOR THE ROLE
#
# Warning! Do not edit this file but set configuration in inventory,
# playbook or as commandline parameter with ansible-playbook command
#
###############################################################################

###############################################################################
# ENVIRONMENT CONFIGURATION
###############################################################################

http_proxy: ""
https_proxy: ""
no_proxy: ""

###############################################################################
# SUPPORTED TARGET OPERATING SYSTEMS
###############################################################################

iac_supported_os:
  - { name: "Rocky", versions: ["9", "10"] }
  - { name: "RedHat", versions: ["9", "10"] }

###############################################################################
# DNF CONFIGURATION
###############################################################################

dnf_sslverify: true
dnf_validate_certs: true
dnf_disable_gpg_check: false
dnf_update_cache: true

###############################################################################
# ANSIBLE LOG
###############################################################################

iac_service_name: "dovecot"
iac_ansible_report: true
iac_ansible_report_tasks_path: "/root/ansible-report-tasks.log"

###############################################################################
# DOVECOT CONFIGURATION
###############################################################################

dovecot_package: "dovecot"
dovecot_service_name: "dovecot"
dovecot_etc_directory: "/etc/dovecot"
dovecot_conf_directory: "/etc/dovecot/conf.d"
dovecot_idarsi_conf_path: "/etc/dovecot/conf.d/99-idarsi.conf"

dovecot_default_protocols:
  - "imap"
  - "pop3"
dovecot_default_mail_location: "maildir:~/Maildir"
dovecot_default_auth_mechanisms:
  - "plain"
  - "login"
dovecot_default_disable_plaintext_auth: true
dovecot_default_ssl: "required"
