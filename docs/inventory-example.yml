---
iac_blueprint:
  dovecot:
    configuration:
      protocols:
        - "imap"
        - "pop3"
      mail_location: "maildir:~/Maildir"
      auth_mechanisms:
        - "plain"
        - "login"
      disable_plaintext_auth: true
      ssl: "required"
      ssl_cert: "/etc/pki/dovecot/certs/dovecot.pem"
      ssl_key: "/etc/pki/dovecot/private/dovecot.pem"
