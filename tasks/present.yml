---
###############################################################################
#
# present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# ENSURING DOVECOT PACKAGE IS PRESENT
###############################################################################

- name: "Normalizing cron records by requested record state"
  ansible.builtin.set_fact:
    dovecot_cron_omitted_state_records: >-
      {{ iac_cron | rejectattr('state', 'defined') | list }}
    dovecot_cron_explicit_present_records: >-
      {{ iac_cron | selectattr('state', 'defined') |
      rejectattr('state', 'equalto', 'absent') | list }}
    dovecot_cron_absent_records: >-
      {{ iac_cron | selectattr('state', 'defined') |
      selectattr('state', 'equalto', 'absent') | list }}

- name: "Combining present cron records"
  ansible.builtin.set_fact:
    dovecot_cron_present_records: >-
      {{ dovecot_cron_omitted_state_records +
         dovecot_cron_explicit_present_records }}

- name: "Ensuring Dovecot package is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    iac_package: "{{ dovecot_package }}"

- name: "Ensuring cronie is installed when cron jobs are configured"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    iac_package: "cronie"
  when: (dovecot_cron_present_records | length) > 0

- name: "Ensuring git is installed when repositories are configured"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    iac_package: "git"
  when: (iac_git_repos | default([])) | length > 0

- name: "Ensuring bind mounts are present"
  ansible.builtin.include_tasks: bind_present.yml
  when: (iac_fs_binds | default([])) | length > 0

- name: "Ensuring filesystem resources are present"
  ansible.builtin.include_tasks: fs_present.yml
  when:
    - (iac_fs_directories | default([])) | length > 0
      or (iac_fs_files | default([])) | length > 0

- name: "Ensuring Git repositories are present"
  ansible.builtin.include_tasks: git_present.yml
  when: (iac_git_repos | default([])) | length > 0

- name: "Ensuring cron jobs are present"
  ansible.builtin.include_tasks: cron_present.yml
  vars:
    dovecot_cron_records: "{{ dovecot_cron_present_records }}"
  when: (dovecot_cron_present_records | length) > 0

- name: "Ensuring explicitly absent cron jobs are absent"
  ansible.builtin.include_tasks: cron_absent.yml
  vars:
    dovecot_cron_records: "{{ dovecot_cron_absent_records }}"
  when: (dovecot_cron_absent_records | length) > 0

###############################################################################
# ENSURING DOVECOT CONFIGURATION IS PRESENT
###############################################################################

- name: "Ensuring Dovecot configuration is present"
  ansible.builtin.include_tasks: configuration_present.yml
