---
###############################################################################
#
# present.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# ENSURING DOVECOT PACKAGE IS PRESENT
###############################################################################

# Inventory validation has already completed in main.yml.  Rendering into a
# temporary directory is safe before bootstrap.  doveconf itself is not
# available until the package is installed, so effective validation retains
# that unavoidable package-bootstrap dependency.
- name: "Rendering Dovecot configuration before package bootstrap"
  block:
    - name: "Creating temporary Dovecot render directory"
      ansible.builtin.tempfile:
        state: "directory"
        prefix: "dovecot-render-"
      register: dovecot_prebootstrap_render_directory
      changed_when: false
    - name: "Rendering the Dovecot configuration candidate before package bootstrap"
      ansible.builtin.template:
        src: "99-idarsi.conf.j2"
        dest: "{{ dovecot_prebootstrap_render_directory.path }}/99-idarsi.conf"
        mode: "0600"
      diff: false
      vars:
        # The package has not been installed yet, so no runtime version exists.
        # Dovecot 2.3 syntax is the conservative bootstrap candidate; the
        # installed version is used for the effective render below.
        dovecot_render_version: "2.3.0"
      no_log: true
      changed_when: false
  always:
    - name: "Removing temporary Dovecot prebootstrap render"
      ansible.builtin.file:
        path: "{{ dovecot_prebootstrap_render_directory.path | default('') }}"
        state: "absent"
      when: dovecot_prebootstrap_render_directory.path is defined
      changed_when: false
      no_log: true

- name: "Ensuring Dovecot package is installed"
  ansible.builtin.include_tasks: package_present.yml
  vars:
    iac_package: "{{ dovecot_package }}"

# Effective configuration validation occurs after package bootstrap and before
# changing any shared filesystem, Git, bind, or cron resource.
- name: "Rendering and validating Dovecot configuration before resource changes"
  ansible.builtin.include_tasks: configuration_present.yml
  vars:
    dovecot_defer_configuration_reload: true

- name: "Initializing the Dovecot resource transaction boundary"
  ansible.builtin.set_fact:
    dovecot_configuration_transaction_committed: false
    dovecot_configuration_transaction_handled: false

- name: "Converging Dovecot resources as one transaction"
  block:
    - name: "Normalizing cron records by requested record state"
      ansible.builtin.set_fact:
        dovecot_cron_omitted_state_records: >-
          {{ iac_cron | rejectattr('state', 'defined') | list }}
        dovecot_cron_explicit_present_records: >-
          {{ iac_cron | selectattr('state', 'defined') |
          rejectattr('state', 'equalto', 'absent') | list }}
        dovecot_cron_absent_records: >-
          {{ iac_cron | selectattr('state', 'defined') |
          selectattr('state', 'equalto', 'absent') | list }}

    - name: "Combining present cron records"
      ansible.builtin.set_fact:
        dovecot_cron_present_records: >-
          {{ dovecot_cron_omitted_state_records +
             dovecot_cron_explicit_present_records }}

    - name: "Ensuring cronie is installed when cron jobs are configured"
      ansible.builtin.include_tasks: package_present.yml
      vars:
        iac_package: "cronie"
      when: (dovecot_cron_present_records | length) > 0

    - name: "Ensuring git is installed when repositories are configured"
      ansible.builtin.include_tasks: package_present.yml
      vars:
        iac_package: "git"
      when: (iac_git_repos | default([])) | length > 0

    - name: "Collecting service state before bind migration"
      ansible.builtin.service_facts:
      when:
        - (iac_fs_binds | default([]) | selectattr('move_from_target', 'defined') |
          selectattr('move_from_target', 'equalto', true) | list | length) > 0

    - name: "Initializing bind migration requirement"
      ansible.builtin.set_fact:
        dovecot_bind_migration_needed: false

    - name: "Checking whether bind migration is required"
      ansible.builtin.include_tasks: bind_migration_check.yml
      loop: "{{ iac_fs_binds | default([]) }}"
      loop_control:
        loop_var: dovecot_bind_record
      when: dovecot_bind_record.move_from_target | default(false) | bool

    - name: "Ensuring bind mounts are present"
      vars:
        dovecot_bind_service_was_running: >-
          {{ ansible_facts.services[dovecot_service_name ~ '.service'] is defined and
             ansible_facts.services[dovecot_service_name ~ '.service'].state == 'running' }}
      when: (iac_fs_binds | default([]) | length) > 0
      block:
        - name: "Quiescing Dovecot before bind migration"
          ansible.builtin.systemd:
            name: "{{ dovecot_service_name }}"
            state: "stopped"
          when:
            - dovecot_bind_migration_needed | bool
            - dovecot_bind_service_was_running | bool

        - name: "Applying requested bind mounts"
          ansible.builtin.include_tasks: bind_present.yml
      always:
        - name: "Restoring the prior Dovecot service state after bind migration"
          ansible.builtin.systemd:
            name: "{{ dovecot_service_name }}"
            state: "started"
          when:
            - dovecot_bind_migration_needed | bool
            - dovecot_bind_service_was_running | bool
          # noqa: no-handler

    - name: "Ensuring filesystem resources are present"
      ansible.builtin.include_tasks: fs_present.yml
      when:
        - (iac_fs_directories | default([])) | length > 0
          or (iac_fs_files | default([])) | length > 0

    - name: "Ensuring Git repositories are present"
      ansible.builtin.include_tasks: git_present.yml
      when: (iac_git_repos | default([])) | length > 0

    - name: "Ensuring cron jobs are present"
      ansible.builtin.include_tasks: cron_present.yml
      vars:
        dovecot_cron_records: "{{ dovecot_cron_present_records }}"
      when: (dovecot_cron_present_records | length) > 0

    - name: "Ensuring explicitly absent cron jobs are absent"
      ansible.builtin.include_tasks: cron_absent.yml
      vars:
        dovecot_cron_records: "{{ dovecot_cron_absent_records }}"
      when: (dovecot_cron_absent_records | length) > 0

    - name: "Injecting the test-only post-configuration resource failure"
      ansible.builtin.fail:
        msg: "Test-only Dovecot resource failure injection"
      when: dovecot_test_resource_failure_once | default(false) | bool

    - name: "Disabling the one-shot test-only resource failure"
      ansible.builtin.set_fact:
        dovecot_test_resource_failure_once: false
      when: dovecot_test_resource_failure_once | default(false) | bool

    - name: "Flushing the Dovecot configuration transaction after resources"
      ansible.builtin.meta: flush_handlers
    - name: "Recording the committed Dovecot configuration transaction"
      ansible.builtin.set_fact:
        dovecot_configuration_transaction_committed: true
  rescue:
    - name: "Rolling back Dovecot configuration after resource failure"
      ansible.builtin.include_tasks: configuration_transaction_rollback.yml
      when:
        # The resource transaction owns the configuration boundary after
        # configuration_present has installed the candidate.  Do not use the
        # copy module's changed flag here: a later resource failure must roll
        # back even when the configuration task was skipped or reported no
        # change after the transaction snapshot was created.
        - not (dovecot_configuration_transaction_committed | default(false) | bool)
        - dovecot_pre_run_transaction_active | default(false) | bool
        - not (dovecot_configuration_transaction_handled | default(false) | bool)
      # noqa: no-handler
    - name: "Preserving a failure already handled by the Dovecot transaction"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg }}"
      when: dovecot_configuration_transaction_handled | default(false) | bool

    - name: "Failing after Dovecot resource transaction rollback"
      ansible.builtin.fail:
        msg: "Dovecot resource convergence failed; the prior configuration was restored"
      when: not (dovecot_configuration_transaction_handled | default(false) | bool)
