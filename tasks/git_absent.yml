---
- name: "Checking Git repository records are defined"
  ansible.builtin.assert:
    that:
      - iac_git_repos is defined
    fail_msg: "iac_git_repos must be defined"

- name: "Initializing Git repository removal change detection"
  ansible.builtin.set_fact:
    dovecot_git_changed: false

- name: "Checking Git repository destinations"
  ansible.builtin.assert:
    that:
      - iac_git_repo_record.dest is defined
      - iac_git_repo_record.dest is match('^/')
    fail_msg: "Git repository record is missing an absolute destination"
  loop: "{{ iac_git_repos | default([]) }}"
  loop_control:
    loop_var: iac_git_repo_record
    label: "{{ iac_git_repo_record.dest | default('unknown') }}"

- name: "Checking Git repository destinations before removal"
  ansible.builtin.stat:
    path: "{{ iac_git_repo_record.dest }}"
  loop: "{{ iac_git_repos | default([]) }}"
  loop_control:
    loop_var: iac_git_repo_record
  register: dovecot_git_before

- name: "Ensuring Git repository working trees are absent"
  ansible.builtin.file:
    path: "{{ iac_git_repo_record.dest }}"
    state: absent
  loop: "{{ iac_git_repos | default([]) }}"
  when: (iac_git_repos | default([])) | length > 0
  loop_control:
    loop_var: iac_git_repo_record
    label: "{{ iac_git_repo_record.dest }}"

- name: "Checking Git repository destinations after removal"
  ansible.builtin.stat:
    path: "{{ iac_git_repo_record.dest }}"
  loop: "{{ iac_git_repos | default([]) }}"
  loop_control:
    loop_var: iac_git_repo_record
  register: dovecot_git_after

- name: "Recording actual Git repository removals"
  ansible.builtin.set_fact:
    dovecot_git_changed: true
  loop: "{{ iac_git_repos | default([]) }}"
  loop_control:
    loop_var: iac_git_repo_record
    index_var: dovecot_git_index
  when: >-
    dovecot_git_before.results[dovecot_git_index].stat.exists !=
    dovecot_git_after.results[dovecot_git_index].stat.exists or
    dovecot_git_before.results[dovecot_git_index].stat.mode | default('') !=
    dovecot_git_after.results[dovecot_git_index].stat.mode | default('')

- name: "Notifying Dovecot for removed configuration Git repositories"
  ansible.builtin.debug:
    msg: "A Dovecot configuration repository was removed"
  changed_when: true
  when:
    - dovecot_git_changed | default(false)
    - iac_git_repos | selectattr('dest', 'match', '^/etc/dovecot(?:/|$)') | list | length > 0
  notify: "dovecot configuration changed"
