---
- name: "Checking Dovecot service state before resource rollback"
  ansible.builtin.service_facts:

- name: "Checking live configuration ownership before rollback"
  ansible.builtin.stat:
    path: "{{ dovecot_idarsi_conf_path }}"
    follow: false
    checksum_algorithm: "sha256"
  register: dovecot_rollback_live_config_stat
  no_log: true

- name: "Checking live marker ownership before rollback"
  ansible.builtin.stat:
    path: "{{ dovecot_configuration_marker_path }}"
    follow: false
    checksum_algorithm: "sha256"
  register: dovecot_rollback_live_marker_stat
  no_log: true

- name: "Reading live rollback marker"
  ansible.builtin.slurp:
    path: "{{ dovecot_configuration_marker_path }}"
  register: dovecot_rollback_live_marker_content
  when: dovecot_rollback_live_marker_stat.stat.isreg | default(false)
  no_log: true

- name: "Checking the rollback snapshot immediately before restore"
  ansible.builtin.stat:
    path: "{{ dovecot_rollback_snapshot_path }}"
    follow: false
    checksum_algorithm: "sha256"
  loop:
    - "{{ dovecot_previous_config_path }}"
    - "{{ dovecot_previous_config_marker_path }}"
  loop_control:
    loop_var: dovecot_rollback_snapshot_path
  register: dovecot_rollback_snapshot_stat
  when: dovecot_pre_run_snapshot_used | default(false) | bool
  no_log: true

- name: "Reading the rollback snapshot marker immediately before restore"
  ansible.builtin.slurp:
    path: "{{ dovecot_previous_config_marker_path }}"
  register: dovecot_rollback_snapshot_marker_content
  when:
    - dovecot_pre_run_snapshot_used | default(false) | bool
    - dovecot_rollback_snapshot_stat.results[1].stat.isreg | default(false)
  no_log: true

- name: "Failing closed when rollback ownership changed"
  ansible.builtin.assert:
    that:
      - dovecot_rollback_live_config_stat.stat.isreg | default(false)
      - dovecot_rollback_live_config_stat.stat.uid | default(-1) == 0
      - dovecot_rollback_live_config_stat.stat.gid | default(-1) == 0
      - dovecot_rollback_live_config_stat.stat.mode | default('') == '0600'
      - dovecot_transaction_expected_config_checksum is defined
      - dovecot_rollback_live_config_stat.stat.checksum == dovecot_transaction_expected_config_checksum
      - dovecot_rollback_live_marker_stat.stat.isreg | default(false)
      - dovecot_rollback_live_marker_stat.stat.uid | default(-1) == 0
      - dovecot_rollback_live_marker_stat.stat.gid | default(-1) == 0
      - dovecot_rollback_live_marker_stat.stat.mode | default('') == '0600'
      - (dovecot_rollback_live_marker_content.content | b64decode) == dovecot_idarsi_marker_content
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[0].stat.isreg
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[0].stat.uid == dovecot_previous_config_uid | int
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[0].stat.gid == dovecot_previous_config_gid | int
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[0].stat.mode == dovecot_previous_config_mode
      - >-
        not (dovecot_pre_run_snapshot_used | default(false) | bool) or
        dovecot_rollback_snapshot_stat.results[0].stat.checksum == dovecot_previous_config_checksum
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[1].stat.isreg
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[1].stat.uid == 0
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[1].stat.gid == 0
      - not (dovecot_pre_run_snapshot_used | default(false) | bool) or dovecot_rollback_snapshot_stat.results[1].stat.mode == '0600'
      - >-
        not (dovecot_pre_run_snapshot_used | default(false) | bool) or
        dovecot_rollback_snapshot_stat.results[1].stat.checksum == dovecot_previous_marker_checksum
      - >-
        not (dovecot_pre_run_snapshot_used | default(false) | bool) or
        (dovecot_rollback_snapshot_marker_content.content | b64decode) == dovecot_idarsi_marker_content
    fail_msg: "Refusing Dovecot rollback because the transaction-installed configuration or marker changed"
  no_log: true

- name: "Restoring the pre-run Dovecot configuration"
  ansible.builtin.copy:
    src: "{{ dovecot_previous_config_path }}"
    dest: "{{ dovecot_idarsi_conf_path }}"
    remote_src: true
    owner: "root"
    group: "root"
    mode: "0600"
  when: dovecot_pre_run_snapshot_used | default(false) | bool
  diff: false
  no_log: true

- name: "Removing the new Dovecot configuration"
  ansible.builtin.include_tasks: configuration_transaction_cleanup.yml
  vars:
    dovecot_configuration_cleanup_records:
      - artifact: "{{ dovecot_idarsi_conf_path }}"
        marker: "{{ dovecot_configuration_marker_path }}"
  when: not (dovecot_pre_run_snapshot_used | default(false) | bool)

- name: "Restoring the pre-run Dovecot marker"
  ansible.builtin.copy:
    content: "{{ dovecot_previous_marker_content | b64decode }}"
    dest: "{{ dovecot_configuration_marker_path }}"
    owner: "{{ dovecot_previous_marker_uid }}"
    group: "{{ dovecot_previous_marker_gid }}"
    mode: "{{ dovecot_previous_marker_mode }}"
  when: dovecot_previous_marker_existed | default(false) | bool
  diff: false
  no_log: true

- name: "Removing the new Dovecot marker"
  ansible.builtin.file:
    path: "{{ dovecot_configuration_marker_path }}"
    state: "absent"
  when:
    - not (dovecot_previous_marker_existed | default(false) | bool)
    - dovecot_rollback_live_marker_stat.stat.isreg | default(false)
    - dovecot_rollback_live_marker_stat.stat.uid | default(-1) == 0
    - dovecot_rollback_live_marker_stat.stat.gid | default(-1) == 0
    - dovecot_rollback_live_marker_stat.stat.mode | default('') == '0600'
    - (dovecot_rollback_live_marker_content.content | b64decode) == dovecot_idarsi_marker_content
  no_log: true

- name: "Reloading the restored Dovecot configuration"
  ansible.builtin.systemd:
    name: "{{ dovecot_service_name }}"
    state: "reloaded"
  when:
    - ansible_facts.services[dovecot_service_name ~ '.service'] is defined
    - ansible_facts.services[dovecot_service_name ~ '.service'].state == 'running'

- name: "Removing the committed Dovecot rollback snapshot"
  ansible.builtin.include_tasks: configuration_transaction_cleanup.yml
  vars:
    dovecot_configuration_cleanup_records:
      - artifact: "{{ dovecot_previous_config_path }}"
        marker: "{{ dovecot_previous_config_marker_path }}"
  when: dovecot_pre_run_snapshot_used | default(false) | bool
  no_log: true

- name: "Recording the completed Dovecot rollback transaction"
  ansible.builtin.set_fact:
    dovecot_configuration_transaction_handled: true
