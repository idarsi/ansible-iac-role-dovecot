---
###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# CHECKING REQUIREMENTS
###############################################################################

- name: "Checking if operating system is supported"
  ansible.builtin.fail:
    msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  when: >
    iac_supported_os | selectattr('name', 'equalto', ansible_facts['distribution'])
                     | selectattr('versions', 'contains', ansible_facts['distribution_major_version'])
                     | list
                     | length == 0

- name: "Checking if service_key is found from variables"
  ansible.builtin.fail:
    msg: "iac_blueprint must be a mapping containing dovecot"
  when: >
    iac_blueprint is not defined or iac_blueprint is not mapping or
    iac_blueprint.dovecot is not defined or
    iac_blueprint.dovecot is not mapping

- name: "Checking that state is explicitly defined"
  ansible.builtin.assert:
    that: state is defined
    fail_msg: "state must be explicitly set; no implicit lifecycle action is selected"

- name: "Setting what Dovecot configuration is to be managed"
  ansible.builtin.set_fact:
    dovecot_configuration: "{{ iac_blueprint.dovecot.configuration | default({}) }}"

- name: "Validating Dovecot inventory blueprint"
  ansible.builtin.include_tasks: validate_inventory.yml

- name: "Validating bind purge sources before mutation"
  ansible.builtin.include_tasks: validate_bind_purge_sources.yml
  when: state in ['validate', 'absent', 'uninstall']

- name: "Validating bind removal scope before mutation"
  ansible.builtin.include_tasks: validate_bind_absent.yml
  when: state in ['absent', 'uninstall']

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting shared Dovecot resource variables"
  ansible.builtin.set_fact:
    iac_fs_directories: "{{ iac_blueprint.dovecot.directories | default([]) }}"
    iac_fs_files: "{{ iac_blueprint.dovecot.files | default([]) }}"
    iac_fs_binds: "{{ iac_blueprint.dovecot.binds | default([]) }}"
    iac_cron: "{{ iac_blueprint.dovecot.cron | default([]) }}"
    iac_git_repos: "{{ iac_blueprint.dovecot.git | default([]) }}"

- name: "Checking whether proxy use is bypassed"
  ansible.builtin.set_fact:
    dovecot_proxy_bypassed: false

- name: "Matching Dovecot host against no_proxy entries"
  ansible.builtin.set_fact:
    dovecot_proxy_bypassed: true
  loop: "{{ no_proxy | default('') | split(',') | map('trim') | reject('equalto', '') | list }}"
  loop_control:
    loop_var: dovecot_no_proxy_entry
  vars:
    dovecot_no_proxy_entry_host: >-
      {{ dovecot_no_proxy_entry | regex_replace(':[0-9]+$', '') | lower }}
  when: >
    dovecot_no_proxy_entry == '*'
    or dovecot_no_proxy_entry_host == (inventory_hostname | lower)
    or (inventory_hostname | lower).endswith('.' ~ dovecot_no_proxy_entry_host.lstrip('.'))

- name: "Checking proxy address if it's defined"
  ansible.builtin.set_fact:
    dovecot_proxy_url: "{{ http_proxy if http_proxy | default('') != '' else https_proxy }}"
  when: >
    (http_proxy | default('') != '' or https_proxy | default('') != '')
    and not dovecot_proxy_bypassed
    and state in ['install', 'present']

- name: "Parsing proxy address"
  ansible.builtin.set_fact:
    proxy_host: "{{ dovecot_proxy_url | urlsplit('hostname') }}"
    proxy_port: >-
      {{ dovecot_proxy_url | urlsplit('port') |
      default(80 if dovecot_proxy_url is match('^http://') else 443, true) | int }}
  when: >
    dovecot_proxy_url is defined
    and not dovecot_proxy_bypassed
    and state in ['install', 'present']

- name: "Checking that proxy connection is working if it's defined"
  ansible.builtin.wait_for:
    host: "{{ proxy_host }}"
    port: "{{ proxy_port }}"
    state: "started"
    timeout: 3
  when: >
    dovecot_proxy_url is defined
    and not dovecot_proxy_bypassed
    and state in ['install', 'present']

###############################################################################
# CHECKING STATES
###############################################################################

- name: "STATE: Validate Dovecot inventory only"
  ansible.builtin.debug:
    msg: "Dovecot blueprint validation succeeded"
  when: state == 'validate'

- name: "STATE: Ensure Dovecot installation and configuration is present"
  ansible.builtin.include_tasks: install.yml
  when: state == 'install'

- name: "STATE: Ensure Dovecot installation and configuration is absent"
  ansible.builtin.include_tasks: uninstall.yml
  when: state == 'uninstall'

- name: "STATE: Ensure Dovecot installation is present"
  ansible.builtin.include_tasks: present.yml
  when: state == 'present'

- name: "STATE: Ensure Dovecot installation is absent"
  ansible.builtin.include_tasks: absent.yml
  when: state == 'absent'

- name: "STATE: Ensure Dovecot configuration is present"
  ansible.builtin.include_tasks: configuration_present.yml
  when: state == 'configuration_present'

- name: "STATE: Ensure Dovecot is started"
  ansible.builtin.include_tasks: started.yml
  when: state == 'started'

- name: "STATE: Ensure Dovecot is stopped"
  ansible.builtin.include_tasks: stopped.yml
  when: state == 'stopped'

- name: "STATE: Ensure Dovecot is restarted"
  ansible.builtin.include_tasks: restarted.yml
  when: state == 'restarted'
