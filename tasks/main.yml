---
###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# CHECKING REQUIREMENTS
###############################################################################

- name: "Checking if operating system is supported"
  ansible.builtin.fail:
    msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  when: >
    iac_supported_os | selectattr('name', 'equalto', ansible_facts['distribution'])
                     | selectattr('versions', 'contains', ansible_facts['distribution_major_version'])
                     | list
                     | length == 0

- name: "Checking if service_key is found from variables"
  ansible.builtin.fail:
    msg: "iac_blueprint must be a mapping containing dovecot"
  when: >
    iac_blueprint is not defined or iac_blueprint is not mapping or
    iac_blueprint.dovecot is not defined or
    iac_blueprint.dovecot is not mapping

- name: "Checking that state is explicitly defined"
  ansible.builtin.assert:
    that: state is defined
    fail_msg: "state must be explicitly set; no implicit lifecycle action is selected"

- name: "Setting what Dovecot configuration is to be managed"
  ansible.builtin.set_fact:
    dovecot_configuration: "{{ iac_blueprint.dovecot.configuration | default({}) }}"

- name: "Validating Dovecot inventory blueprint"
  ansible.builtin.include_tasks: validate_inventory.yml

- name: "Validating bind purge sources before mutation"
  ansible.builtin.include_tasks: validate_bind_purge_sources.yml
  when: state in ['validate', 'absent', 'uninstall']

- name: "Validating bind removal scope before mutation"
  ansible.builtin.include_tasks: validate_bind_absent.yml
  when: state in ['absent', 'uninstall']

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting shared Dovecot resource variables"
  ansible.builtin.set_fact:
    iac_fs_directories: "{{ iac_blueprint.dovecot.directories | default([]) }}"
    iac_fs_files: "{{ iac_blueprint.dovecot.files | default([]) }}"
    iac_fs_binds: "{{ iac_blueprint.dovecot.binds | default([]) }}"
    iac_cron: "{{ iac_blueprint.dovecot.cron | default([]) }}"
    iac_git_repos: "{{ iac_blueprint.dovecot.git | default([]) }}"

- name: "Collecting service facts for safe reload notifications"
  ansible.builtin.service_facts:
  when: state != 'validate'

- name: "Checking for the managed configuration before resource changes"
  ansible.builtin.stat:
    path: "{{ dovecot_idarsi_conf_path }}"
    follow: false
    checksum_algorithm: "sha256"
  register: dovecot_prechange_config_stat
  when: state in ['install', 'present', 'configuration_present']

- name: "Resetting the per-invocation Dovecot transaction context"
  ansible.builtin.set_fact:
    dovecot_configuration_transaction_handled: false
    dovecot_configuration_transaction_committed: false
    dovecot_pre_run_transaction_active: false
    dovecot_pre_run_snapshot_used: false
    dovecot_pre_run_snapshot_created: false
  when: state in ['install', 'present', 'configuration_present']

- name: "Checking transactional candidate and rollback paths without following links"
  ansible.builtin.stat:
    path: "{{ dovecot_transaction_path }}"
    follow: false
  loop:
    - "{{ dovecot_idarsi_conf_path }}.candidate"
    - "{{ dovecot_idarsi_conf_path }}.previous"
    - "{{ dovecot_idarsi_conf_path }}.candidate{{ dovecot_idarsi_marker_suffix }}"
    - "{{ dovecot_idarsi_conf_path }}.previous{{ dovecot_idarsi_marker_suffix }}"
  loop_control:
    loop_var: dovecot_transaction_path
  register: dovecot_transaction_path_stats
  when: state in ['install', 'present', 'configuration_present']

- name: "Rejecting managed configuration and transaction symlinks"
  ansible.builtin.assert:
    that:
      - not dovecot_prechange_config_stat.stat.islnk | default(false)
      - not (dovecot_transaction_path_stats.results |
        selectattr('stat.islnk', 'defined') | selectattr('stat.islnk', 'equalto', true) |
        list | length > 0)
    fail_msg: "Dovecot managed configuration and transaction paths must be regular files or absent"
  when: state in ['install', 'present', 'configuration_present']

- name: "Checking for the prior Dovecot ownership marker without following links"
  ansible.builtin.stat:
    path: "{{ dovecot_idarsi_conf_path }}{{ dovecot_idarsi_marker_suffix }}"
    follow: false
  register: dovecot_prechange_marker_stat
  when: state in ['install', 'present', 'configuration_present']

- name: "Reading the prior Dovecot ownership marker"
  ansible.builtin.slurp:
    path: "{{ dovecot_idarsi_conf_path }}{{ dovecot_idarsi_marker_suffix }}"
  register: dovecot_prechange_marker_content
  when:
    - state in ['install', 'present', 'configuration_present']
    - dovecot_prechange_marker_stat.stat.isreg | default(false)

- name: "Refusing an unsafe existing Dovecot ownership marker"
  ansible.builtin.assert:
    that:
      - not dovecot_prechange_marker_stat.stat.exists | default(false) or
        (dovecot_prechange_marker_stat.stat.isreg | default(false) and
         dovecot_prechange_marker_stat.stat.uid | default(-1) == 0 and
         dovecot_prechange_marker_stat.stat.gid | default(-1) == 0 and
         dovecot_prechange_marker_stat.stat.mode | default('') == '0600' and
         (dovecot_prechange_marker_content.content | default('') | b64decode) == dovecot_idarsi_marker_content)
    fail_msg: "Refusing to replace an unsafe Dovecot ownership marker"
  when: state in ['install', 'present', 'configuration_present']

- name: "Refusing an orphaned managed Dovecot configuration or marker"
  ansible.builtin.assert:
    that:
      - >-
        (not dovecot_prechange_config_stat.stat.exists | default(false) and
         not dovecot_prechange_marker_stat.stat.exists | default(false)) or
        (dovecot_prechange_config_stat.stat.isreg | default(false) and
         dovecot_prechange_marker_stat.stat.isreg | default(false))
    fail_msg: "Refusing orphaned managed Dovecot configuration state; operator cleanup is required"
  when: state in ['install', 'present', 'configuration_present']

- name: "Checking for an existing Dovecot pre-run snapshot"
  ansible.builtin.stat:
    path: "{{ dovecot_idarsi_conf_path }}.previous"
    follow: false
  register: dovecot_prechange_previous_stat
  when: state in ['install', 'present', 'configuration_present']

- name: "Checking for the pre-run snapshot ownership marker"
  ansible.builtin.stat:
    path: "{{ dovecot_idarsi_conf_path }}.previous{{ dovecot_idarsi_marker_suffix }}"
    follow: false
  register: dovecot_prechange_previous_marker_stat
  when: state in ['install', 'present', 'configuration_present']

- name: "Reading the pre-run snapshot ownership marker"
  ansible.builtin.slurp:
    path: "{{ dovecot_idarsi_conf_path }}.previous{{ dovecot_idarsi_marker_suffix }}"
  register: dovecot_prechange_previous_marker_content
  when:
    - state in ['install', 'present', 'configuration_present']
    - dovecot_prechange_previous_marker_stat.stat.isreg | default(false)

- name: "Refusing an incomplete or mismatched Dovecot pre-run snapshot"
  ansible.builtin.assert:
    that:
      - >-
        (not dovecot_prechange_previous_stat.stat.exists | default(false) and
         not dovecot_prechange_previous_marker_stat.stat.exists | default(false)) or
        (dovecot_prechange_previous_stat.stat.isreg | default(false) and
         dovecot_prechange_previous_stat.stat.uid | default(-1) == 0 and
         dovecot_prechange_previous_stat.stat.gid | default(-1) == 0 and
         dovecot_prechange_previous_stat.stat.mode | default('') == '0600' and
         dovecot_prechange_previous_marker_stat.stat.isreg | default(false) and
         dovecot_prechange_previous_marker_stat.stat.uid | default(-1) == 0 and
         dovecot_prechange_previous_marker_stat.stat.gid | default(-1) == 0 and
         dovecot_prechange_previous_marker_stat.stat.mode | default('') == '0600' and
         (dovecot_prechange_previous_marker_content.content | default('') | b64decode) == dovecot_idarsi_marker_content)
    fail_msg: "Refusing an incomplete or mismatched Dovecot pre-run snapshot; operator cleanup is required"
  when: state in ['install', 'present', 'configuration_present']

- name: "Recording the immutable pre-run configuration snapshot paths"
  ansible.builtin.set_fact:
    dovecot_previous_config_path: "{{ dovecot_idarsi_conf_path }}.previous"
    dovecot_previous_config_marker_path: "{{ dovecot_idarsi_conf_path }}.previous{{ dovecot_idarsi_marker_suffix }}"
    dovecot_configuration_marker_path: "{{ dovecot_idarsi_conf_path }}{{ dovecot_idarsi_marker_suffix }}"
    dovecot_candidate_config_marker_path: >-
      {{ dovecot_idarsi_conf_path }}.candidate{{ dovecot_idarsi_marker_suffix }}
    dovecot_previous_marker_existed: >-
      {{ dovecot_prechange_marker_stat.stat.exists | default(false) }}
    dovecot_previous_marker_content: >-
      {{ dovecot_prechange_marker_content.content | default('') }}
    dovecot_previous_marker_uid: >-
      {{ dovecot_prechange_marker_stat.stat.uid | default(0) }}
    dovecot_previous_marker_gid: >-
      {{ dovecot_prechange_marker_stat.stat.gid | default(0) }}
    dovecot_previous_marker_mode: >-
      {{ dovecot_prechange_marker_stat.stat.mode | default('0600') }}
    dovecot_pre_run_snapshot_used: >-
      {{ dovecot_prechange_previous_stat.stat.isreg | default(false) and
         dovecot_prechange_previous_marker_stat.stat.isreg | default(false) }}
  when: state in ['install', 'present', 'configuration_present']

- name: "Creating the immutable pre-run Dovecot snapshot"
  when:
    - state in ['install', 'present', 'configuration_present']
    - dovecot_prechange_config_stat.stat.exists | default(false)
    - not dovecot_prechange_previous_stat.stat.exists | default(false)
  block:
    - name: "Capturing the pre-run managed Dovecot configuration"
      ansible.builtin.copy:
        src: "{{ dovecot_idarsi_conf_path }}"
        dest: "{{ dovecot_idarsi_conf_path }}.previous"
        remote_src: true
        owner: "root"
        group: "root"
        mode: "0600"
        force: false
      diff: false
      no_log: true
      changed_when: false
    - name: "Marking the immutable pre-run Dovecot snapshot"
      ansible.builtin.copy:
        content: "{{ dovecot_idarsi_marker_content }}"
        dest: "{{ dovecot_idarsi_conf_path }}.previous{{ dovecot_idarsi_marker_suffix }}"
        owner: "root"
        group: "root"
        mode: "0600"
        force: false
      diff: false
      no_log: true
      changed_when: false
    - name: "Recording the pre-run Dovecot snapshot transaction context"
      ansible.builtin.set_fact:
        dovecot_pre_run_transaction_active: true
        dovecot_pre_run_snapshot_used: true
        dovecot_pre_run_snapshot_created: true

- name: "Checking whether proxy use is bypassed"
  ansible.builtin.set_fact:
    dovecot_proxy_bypassed: false

- name: "Matching Dovecot host against no_proxy entries"
  ansible.builtin.set_fact:
    dovecot_proxy_bypassed: true
  loop: "{{ no_proxy | default('') | split(',') | map('trim') | reject('equalto', '') | list }}"
  loop_control:
    loop_var: dovecot_no_proxy_entry
  vars:
    dovecot_no_proxy_entry_host: >-
      {{ dovecot_no_proxy_entry | regex_replace(':[0-9]+$', '') | lower }}
  when: >
    dovecot_no_proxy_entry == '*'
    or dovecot_no_proxy_entry_host == (inventory_hostname | lower)
    or (inventory_hostname | lower).endswith('.' ~ dovecot_no_proxy_entry_host.lstrip('.'))

- name: "Checking proxy address if it's defined"
  ansible.builtin.set_fact:
    dovecot_proxy_url: "{{ http_proxy if http_proxy | default('') != '' else https_proxy }}"
  when: >
    (http_proxy | default('') != '' or https_proxy | default('') != '')
    and not dovecot_proxy_bypassed
    and state in ['install', 'present']

- name: "Parsing proxy address"
  ansible.builtin.set_fact:
    proxy_host: "{{ dovecot_proxy_url | urlsplit('hostname') }}"
    proxy_port: >-
      {{ dovecot_proxy_url | urlsplit('port') |
      default(80 if dovecot_proxy_url is match('^http://') else 443, true) | int }}
  when: >
    dovecot_proxy_url is defined
    and not dovecot_proxy_bypassed
    and state in ['install', 'present']

- name: "Checking that proxy connection is working if it's defined"
  ansible.builtin.wait_for:
    host: "{{ proxy_host }}"
    port: "{{ proxy_port }}"
    state: "started"
    timeout: 3
  when: >
    dovecot_proxy_url is defined
    and not dovecot_proxy_bypassed
    and state in ['install', 'present']

###############################################################################
# CHECKING STATES
###############################################################################

- name: "Converging Dovecot state with failed-run snapshot recovery"
  block:
    - name: "Dispatching the requested Dovecot state"
      ansible.builtin.include_tasks: state_dispatch.yml
  rescue:
    - name: "Removing the exact owned pre-run snapshot after failed convergence"
      ansible.builtin.include_tasks: configuration_transaction_cleanup.yml
      vars:
        dovecot_configuration_cleanup_records:
          - artifact: "{{ dovecot_previous_config_path | default('') }}"
            marker: "{{ dovecot_previous_config_marker_path | default('') }}"
      when:
        - not ansible_check_mode
        - dovecot_pre_run_transaction_active | default(false) | bool
        - dovecot_previous_config_path is defined
        - dovecot_previous_config_marker_path is defined
    - name: "Re-raising the failed Dovecot convergence"
      ansible.builtin.fail:
        msg: "Dovecot convergence failed; owned pre-run snapshot recovery was attempted"

###############################################################################
# COMMIT ONE RELOAD TRANSACTION AFTER ALL RESOURCE CONVERGENCE
###############################################################################

- name: "Refreshing service facts before deciding whether reload is required"
  ansible.builtin.service_facts:
  when: state in ['install', 'present', 'configuration_present']

- name: "Flushing the Dovecot configuration and resource transaction"
  ansible.builtin.meta: flush_handlers
  when: state in ['install', 'present', 'configuration_present']

- name: "Removing an unused pre-run Dovecot snapshot"
  ansible.builtin.include_tasks: configuration_transaction_cleanup.yml
  vars:
    dovecot_configuration_cleanup_records:
      - artifact: "{{ dovecot_previous_config_path | default('') }}"
        marker: "{{ dovecot_previous_config_marker_path | default('') }}"
  when:
    - state in ['install', 'present', 'configuration_present']
