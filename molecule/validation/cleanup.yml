---
- name: "Remove the controller-local validation token"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    dovecot_molecule_ephemeral_directory: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
  tasks:
    - name: "Find validation tokens created by this Molecule lifecycle"
      ansible.builtin.find:
        paths: "{{ dovecot_molecule_ephemeral_directory }}"
        patterns: "dovecot-validation-token-*"
        file_type: "file"
        follow: false
      register: dovecot_validation_token_files
    - name: "Remove validation tokens created by this Molecule lifecycle"
      ansible.builtin.file:
        path: "{{ dovecot_validation_token_file.path }}"
        state: "absent"
      loop: "{{ dovecot_validation_token_files.files }}"
      loop_control:
        loop_var: dovecot_validation_token_file

- name: "Remove the remote validation snapshot"
  hosts: all
  become: false
  ignore_unreachable: true
  tasks:
    - name: "Check whether the validation snapshot remains"
      ansible.builtin.stat:
        path: "/tmp/dovecot-validation-snapshot.json"
      register: dovecot_validation_snapshot_stat
    - name: "Remove the validation snapshot securely"
      ansible.builtin.file:
        path: "/tmp/dovecot-validation-snapshot.json"
        state: "absent"
      when: dovecot_validation_snapshot_stat.stat.exists
