---
- name: "Global absent removes only the declared cron entry"
  hosts: all
  become: false
  vars:
    state: "absent"
    iac_blueprint:
      dovecot:
        configuration:
          ssl: "no"
        cron:
          - name: "global-absent-managed"
            cron_file: "dovecot_global_absent"
  pre_tasks:
    - name: "Ensuring Dovecot configuration directory exists for fixtures"
      ansible.builtin.file:
        path: "/etc/dovecot/conf.d"
        state: "directory"
        mode: "0755"
      tags:
        - molecule-idempotence-notest
    - name: "Installing the crontab prerequisite for the pinned shared task"
      ansible.builtin.package:
        name: "cronie"
        state: "present"
      tags:
        - molecule-idempotence-notest
    - name: "Ensuring cron fixture directory exists"
      ansible.builtin.file:
        path: "/etc/cron.d"
        state: "directory"
        mode: "0755"
      tags:
        - molecule-idempotence-notest
    - name: "Creating unmarked global-absent cron fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/dovecot_global_absent"
        content: |
          #Ansible: global-absent-managed
          0 0 * * * root /bin/true
          #Ansible: global-absent-remove
          0 1 * * * root /bin/true
          #Ansible: global-retained
          0 2 * * * root /bin/true
        mode: "0644"
      tags:
        - molecule-idempotence-notest
  tasks:
    - name: "Running the Dovecot role"
      ansible.builtin.include_role:
        name: ansible-iac-role-dovecot
  post_tasks:
    - name: "Reading global-absent cron fixture"
      ansible.builtin.slurp:
        src: "/etc/cron.d/dovecot_global_absent"
      register: dovecot_global_absent_content
    - name: "Asserting global absent preserved unrelated entry"
      ansible.builtin.assert:
        that:
          - dovecot_global_absent_content.content | b64decode is not search('global-absent-managed')
          - "'global-absent-remove' in (dovecot_global_absent_content.content | b64decode)"
          - "'global-retained' in (dovecot_global_absent_content.content | b64decode)"
- name: "Global uninstall removes only the declared cron entry"
  hosts: all
  become: false
  vars:
    state: "uninstall"
    iac_blueprint:
      dovecot:
        configuration:
          ssl: "no"
        cron:
          - name: "global-uninstall-managed"
            cron_file: "dovecot_global_uninstall"
  pre_tasks:
    - name: "Ensuring cron fixture directory exists"
      ansible.builtin.file:
        path: "/etc/cron.d"
        state: "directory"
        mode: "0755"
      tags:
        - molecule-idempotence-notest
    - name: "Creating unmarked global-uninstall cron fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/dovecot_global_uninstall"
        content: |
          #Ansible: global-uninstall-managed
          0 0 * * * root /bin/true
          #Ansible: global-uninstall-remove
          0 1 * * * root /bin/true
          #Ansible: global-retained-uninstall
          0 2 * * * root /bin/true
        mode: "0644"
      tags:
        - molecule-idempotence-notest
  tasks:
    - name: "Running the Dovecot role"
      ansible.builtin.include_role:
        name: ansible-iac-role-dovecot
  post_tasks:
    - name: "Reading global-uninstall cron fixture"
      ansible.builtin.slurp:
