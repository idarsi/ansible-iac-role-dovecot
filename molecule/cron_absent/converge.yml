---
- name: "Remove an explicit absent cron record without changing cronie state"
  hosts: all
  become: false
  vars:
    state: "present"
    iac_blueprint:
      dovecot:
        configuration:
          ssl: "no"
        cron:
          - name: "fresh-absent-cron"
            state: "absent"
            cron_file: "fresh-absent-cron"
  pre_tasks:
    - name: "Recording initial package state"
      ansible.builtin.package_facts:
        manager: "auto"
    - name: "Saving initial cronie package state"
      ansible.builtin.set_fact:
        dovecot_cronie_initial: "{{ 'cronie' in ansible_facts.packages }}"
    - name: "Creating cron directory for absent fixture"
      ansible.builtin.file:
        path: "/etc/cron.d"
        state: "directory"
        mode: "0755"
      tags:
        - molecule-idempotence-notest
    - name: "Creating role-owned cron fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/fresh-absent-cron"
        content: "0 0 * * * root /bin/true\n"
        mode: "0644"
      tags:
        - molecule-idempotence-notest
    - name: "Reading role-owned cron fixture identity"
      ansible.builtin.stat:
        path: "/etc/cron.d/fresh-absent-cron"
      register: dovecot_fresh_absent_cron_stat
      tags:
        - molecule-idempotence-notest
    - name: "Creating identity-bound role ownership marker"
      ansible.builtin.copy:
        dest: "/etc/cron.d/.fresh-absent-cron.idarsi-managed"
        content: >-
          {{ {'path': '/etc/cron.d/fresh-absent-cron', 'inode': dovecot_fresh_absent_cron_stat.stat.inode,
              'checksum': dovecot_fresh_absent_cron_stat.stat.checksum,
              'size': dovecot_fresh_absent_cron_stat.stat.size,
              'mode': dovecot_fresh_absent_cron_stat.stat.mode} | to_json }}
        mode: "0600"
      tags:
        - molecule-idempotence-notest
  roles:
    - role: ansible-iac-role-dovecot
  post_tasks:
    - name: "Recording final package state"
      ansible.builtin.package_facts:
        manager: "auto"
    - name: "Checking explicit absent cron left cronie package state unchanged"
      ansible.builtin.assert:
        that:
          - ("cronie" in ansible_facts.packages) == dovecot_cronie_initial
        fail_msg: "Explicit absent cron handling changed cronie package state"

- name: "Recover a managed cron file deleted externally"
  hosts: all
  become: false
  vars:
    state: "present"
    iac_blueprint:
      dovecot:
        configuration:
          ssl: "no"
        cron:
          - name: "recovery-cron"
            job: "/bin/true"
            cron_file: "recovery-cron"
  roles:
    - role: ansible-iac-role-dovecot

- name: "Recreate a managed cron file after external deletion"
  hosts: all
  become: false
  vars:
    state: "present"
    iac_blueprint:
      dovecot:
        configuration:
          ssl: "no"
        cron:
          - name: "recovery-cron"
            job: "/bin/true"
            cron_file: "recovery-cron"
  pre_tasks:
    - name: "Deleting managed cron file externally"
      ansible.builtin.file:
        path: "/etc/cron.d/recovery-cron"
        state: "absent"
      tags:
        - molecule-idempotence-notest
  roles:
    - role: ansible-iac-role-dovecot
  post_tasks:
    - name: "Checking recovered cron file"
      ansible.builtin.stat:
        path: "/etc/cron.d/recovery-cron"
      register: dovecot_recovery_cron_stat
    - name: "Checking refreshed recovery marker"
      ansible.builtin.stat:
        path: "/etc/cron.d/.recovery-cron.idarsi-managed"
      register: dovecot_recovery_marker_stat
    - name: "Asserting managed cron recovery"
      ansible.builtin.assert:
        that:
          - dovecot_recovery_cron_stat.stat.exists
          - dovecot_recovery_marker_stat.stat.exists
          - dovecot_recovery_marker_stat.stat.mode == "0600"

- name: "Verify cron absent guardrails"
  hosts: all
  become: false
  tags: ["molecule-idempotence-notest"]
  pre_tasks:
    - name: "Creating unowned cron guardrail fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/unowned-cron"
        content: "0 0 * * * root /bin/true\n"
        mode: "0644"
      tags: ["molecule-idempotence-notest"]
    - name: "Creating changed cron guardrail fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/changed-cron"
        content: "original cron content\n"
        mode: "0644"
      tags: ["molecule-idempotence-notest"]
    - name: "Reading changed cron identity"
      ansible.builtin.stat:
        path: "/etc/cron.d/changed-cron"
      register: dovecot_changed_cron_stat
      tags: ["molecule-idempotence-notest"]
    - name: "Creating changed cron ownership marker"
      ansible.builtin.copy:
        dest: "/etc/cron.d/.changed-cron.idarsi-managed"
        content: >-
          {{ {'path': '/etc/cron.d/changed-cron', 'inode': dovecot_changed_cron_stat.stat.inode,
              'checksum': dovecot_changed_cron_stat.stat.checksum,
              'size': dovecot_changed_cron_stat.stat.size,
              'mode': dovecot_changed_cron_stat.stat.mode} | to_json }}
        mode: "0600"
      tags: ["molecule-idempotence-notest"]
    - name: "Changing cron guardrail fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/changed-cron"
        content: "changed cron content\n"
        mode: "0644"
      tags: ["molecule-idempotence-notest"]
    - name: "Creating malformed cron guardrail fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/malformed-cron"
        content: "0 0 * * * root /bin/true\n"
        mode: "0644"
      tags: ["molecule-idempotence-notest"]
    - name: "Creating malformed cron marker"
      ansible.builtin.copy:
        dest: "/etc/cron.d/.malformed-cron.idarsi-managed"
        content: "not-json\n"
        mode: "0600"
      tags: ["molecule-idempotence-notest"]
    - name: "Creating invalid-permissions cron guardrail fixture"
      ansible.builtin.copy:
        dest: "/etc/cron.d/permissions-cron"
        content: "0 0 * * * root /bin/true\n"
        mode: "0644"
      tags: ["molecule-idempotence-notest"]
    - name: "Creating insecure cron marker"
      ansible.builtin.copy:
        dest: "/etc/cron.d/.permissions-cron.idarsi-managed"
        content: "{}\n"
        mode: "0644"
      tags: ["molecule-idempotence-notest"]
  tasks:
    - name: "Reject unowned cron file"
      block:
        - name: "Running absent task for unowned cron file"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/cron_absent_record.yml"
          vars:
            dovecot_cron_absent_record:
              name: "unowned-cron"
              cron_file: "unowned-cron"
        - name: "Failing if unowned cron file was removed"
          ansible.builtin.fail:
            msg: "Unowned cron file was removed"
      rescue:
        - name: "Checking unowned cron file remains intact"
          ansible.builtin.stat:
            path: "/etc/cron.d/unowned-cron"
          register: dovecot_unowned_cron_stat
        - name: "Asserting unowned cron file rejection"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Refusing to remove unowned or changed Dovecot cron file unowned-cron"
              - dovecot_unowned_cron_stat.stat.exists
    - name: "Reject changed cron file"
      block:
        - name: "Running absent task for changed cron file"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/cron_absent_record.yml"
          vars:
            dovecot_cron_absent_record:
              name: "changed-cron"
              cron_file: "changed-cron"
        - name: "Failing if changed cron file was removed"
          ansible.builtin.fail:
            msg: "Changed cron file was removed"
      rescue:
        - name: "Checking changed cron file remains intact"
          ansible.builtin.stat:
            path: "/etc/cron.d/changed-cron"
          register: dovecot_changed_cron_after
        - name: "Asserting changed cron file rejection"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Refusing to remove unowned or changed Dovecot cron file changed-cron"
              - dovecot_changed_cron_after.stat.exists
    - name: "Reject malformed cron marker"
      block:
        - name: "Running absent task for malformed cron marker"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/cron_absent_record.yml"
          vars:
            dovecot_cron_absent_record:
              name: "malformed-cron"
              cron_file: "malformed-cron"
        - name: "Failing if malformed cron file was removed"
          ansible.builtin.fail:
            msg: "Malformed cron file was removed"
      rescue:
        - name: "Checking malformed cron file remains intact"
          ansible.builtin.stat:
            path: "/etc/cron.d/malformed-cron"
          register: dovecot_malformed_cron_stat
        - name: "Asserting malformed cron marker rejection"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Refusing to remove malformed Dovecot cron ownership manifest malformed-cron"
              - dovecot_malformed_cron_stat.stat.exists
    - name: "Reject insecure cron marker"
      block:
        - name: "Running absent task for insecure cron marker"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../tasks/cron_absent_record.yml"
          vars:
            dovecot_cron_absent_record:
              name: "permissions-cron"
              cron_file: "permissions-cron"
        - name: "Failing if insecure cron file was removed"
          ansible.builtin.fail:
            msg: "Insecure cron file was removed"
      rescue:
        - name: "Checking insecure cron file remains intact"
          ansible.builtin.stat:
            path: "/etc/cron.d/permissions-cron"
          register: dovecot_permissions_cron_stat
        - name: "Asserting insecure cron marker rejection"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Refusing to remove unowned or changed Dovecot cron file permissions-cron"
              - dovecot_permissions_cron_stat.stat.exists
