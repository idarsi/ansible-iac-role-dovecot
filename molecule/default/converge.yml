- name: Converge
  hosts: all
  become: false
  vars:
    state: install
    ansible_become_method: su
    iac_blueprint:
      dovecot:
        configuration:
          protocols:
            - imap
            - pop3
          mail_location: "maildir:/var/lib/dovecot-mail/%d/%n"
          auth_mechanisms:
            - plain
            - login
          disable_plaintext_auth: true
          ssl: "no"
          extra_parameters:
            login_greeting: "Dovecot ready."
            mail_privileged_group: "mail"
        directories:
          - path: /tmp/dovecot-shared
            owner: root
            group: root
            mode: "0750"
        files:
          - path: /tmp/dovecot-shared/example.txt
            content: "dovecot molecule shared fixture\n"
            owner: root
            group: root
            mode: "0640"
        binds:
          - source: /srv/data/dovecot-mail
            target: /var/lib/dovecot-mail
            owner: root
            group: root
            mode: "0750"
            move_from_target: true
        cron:
          - name: "dovecot_heartbeat"
            user: "root"
            minute: "0"
            hour: "3"
            job: "/bin/true"
            cron_file: "dovecot_heartbeat"
        git:
          - repo: "/tmp/dovecot-molecule-source"
            dest: "/var/lib/dovecot-config"
            version: "main"
            update: true
  pre_tasks:
    - name: "Stopping Dovecot before cleaning previous bind test state"
      ansible.builtin.systemd:
        name: dovecot
        state: stopped
      failed_when: false
      tags:
        - molecule-idempotence-notest

    - name: "Checking whether Dovecot bind target is currently mounted"
      ansible.builtin.command: "findmnt -n -M /var/lib/dovecot-mail -o SOURCE"
      register: dovecot_molecule_existing_bind_mount
      changed_when: false
      failed_when: false

    - name: "Unmounting previous Dovecot bind mount from failed test runs"
      ansible.builtin.command: "umount /var/lib/dovecot-mail"
      register: dovecot_molecule_umount_result
      failed_when: false
      changed_when: dovecot_molecule_umount_result.rc == 0
      when: dovecot_molecule_existing_bind_mount.rc == 0
      tags:
        - molecule-idempotence-notest

    - name: "Lazy-unmounting previous busy Dovecot bind mount"
      ansible.builtin.command: "umount -l /var/lib/dovecot-mail"
      failed_when: false
      changed_when: true
      when:
        - dovecot_molecule_existing_bind_mount.rc == 0
        - dovecot_molecule_umount_result.rc is defined
        - dovecot_molecule_umount_result.rc != 0
      tags:
        - molecule-idempotence-notest

    - name: "Removing previous Dovecot bind mount fstab entry"
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^/srv/data/dovecot-mail\\s+/var/lib/dovecot-mail\\s+none\\s+bind\\s+0\\s+0$"
        state: absent
      failed_when: false
      tags:
        - molecule-idempotence-notest

    - name: "Removing previous Dovecot shared resource fixtures"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /srv/data/dovecot-mail
        - /var/lib/dovecot-mail
        - /tmp/dovecot-shared
        - /var/lib/dovecot-config
      tags:
        - molecule-idempotence-notest

    - name: "Ensuring /etc/fstab exists for Dovecot bind mount test"
      ansible.builtin.copy:
        dest: /etc/fstab
        owner: root
        group: root
        mode: "0644"
        force: false
        content: ""

    - name: "Creating Dovecot bind migration target directory"
      ansible.builtin.file:
        path: /var/lib/dovecot-mail
        state: directory
        owner: root
        group: root
        mode: "0750"
      tags:
        - molecule-idempotence-notest

    - name: "Writing Dovecot bind migration fixture into target directory"
      ansible.builtin.copy:
        dest: /var/lib/dovecot-mail/molecule-bind-migrated.txt
        owner: root
        group: root
        mode: "0600"
        content: "dovecot legacy bind data\n"
      tags:
        - molecule-idempotence-notest

    - name: "Confirming bind migration target is not itself mounted"
      ansible.builtin.command: "findmnt -n -M /var/lib/dovecot-mail"
      register: dovecot_molecule_unmounted_target
      changed_when: false
      failed_when: false

    - name: "Asserting bind migration fixture starts on the containing filesystem"
      ansible.builtin.assert:
        that:
          - dovecot_molecule_unmounted_target.rc != 0
        fail_msg: "The bind migration fixture target unexpectedly has its own mountpoint"
      tags:
        - molecule-idempotence-notest

    - name: "Ensuring Git is installed for Dovecot Molecule fixture"
      ansible.builtin.package:
        name: git
        state: present

    - name: "Ensuring Dovecot Molecule Git source directory exists"
      ansible.builtin.file:
        path: /tmp/dovecot-molecule-source
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Writing Dovecot Molecule Git source fixture"
      ansible.builtin.copy:
        dest: /tmp/dovecot-molecule-source/README.md
        owner: root
        group: root
        mode: "0644"
        content: "dovecot molecule git fixture\n"

    - name: "Checking whether Dovecot Molecule Git source repository exists"
      ansible.builtin.stat:
        path: /tmp/dovecot-molecule-source/.git
      register: dovecot_molecule_git_source_repo

    - name: "Initializing Dovecot Molecule Git source repository"
      ansible.builtin.command:
        argv:
          - git
          - init
          - --initial-branch=main
          - /tmp/dovecot-molecule-source
      changed_when: true
      when: not dovecot_molecule_git_source_repo.stat.exists

    - name: "Configuring Dovecot Molecule Git source repository user email"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/dovecot-molecule-source
          - config
          - user.email
          - molecule@example.org
      changed_when: true
      when: not dovecot_molecule_git_source_repo.stat.exists

    - name: "Configuring Dovecot Molecule Git source repository user name"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/dovecot-molecule-source
          - config
          - user.name
          - Molecule
      changed_when: true
      when: not dovecot_molecule_git_source_repo.stat.exists

    - name: "Adding Dovecot Molecule Git source fixture"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/dovecot-molecule-source
          - add
          - README.md
      changed_when: true
      when: not dovecot_molecule_git_source_repo.stat.exists

    - name: "Committing Dovecot Molecule Git source fixture"
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /tmp/dovecot-molecule-source
          - commit
          - -m
          - "Add Molecule fixture"
      changed_when: true
      when: not dovecot_molecule_git_source_repo.stat.exists
  roles:
    - role: ansible-iac-role-dovecot

  tasks:
    - name: "Reading the initial Dovecot configuration before later mutation"
      ansible.builtin.slurp:
        path: "/etc/dovecot/conf.d/99-idarsi.conf"
      register: dovecot_initial_configuration

    - name: "Asserting the initial Dovecot fixture configuration"
      ansible.builtin.assert:
        that:
          - "'protocols = imap pop3' in (dovecot_initial_configuration.content | b64decode).splitlines()"
          - "'auth_mechanisms = plain login' in (dovecot_initial_configuration.content | b64decode).splitlines()"
        fail_msg: "Initial Dovecot fixture configuration did not converge as documented"

    - name: "Running a second Dovecot convergence"
      ansible.builtin.include_role:
        name: ansible-iac-role-dovecot

    - name: "Checking rollback state after second Dovecot convergence"
      ansible.builtin.stat:
        path: "/etc/dovecot/conf.d/99-idarsi.conf.previous"
      register: dovecot_second_convergence_previous_config

    - name: "Checking rollback marker state after second Dovecot convergence"
      ansible.builtin.stat:
        path: "/etc/dovecot/conf.d/99-idarsi.conf.previous.idarsi-managed"
      register: dovecot_second_convergence_previous_marker

    - name: "Asserting second Dovecot convergence leaves no rollback copy"
      ansible.builtin.assert:
        that:
          - not dovecot_second_convergence_previous_config.stat.exists
          - not dovecot_second_convergence_previous_marker.stat.exists
        fail_msg: "Second Dovecot convergence left stale rollback state"

- name: "Verify invalid Dovecot configuration preserves the live file"
  hosts: all
  become: false
  vars:
    state: "configuration_present"
    dovecot_invalid_configuration:
      ssl: "no"
      extra_parameters:
        idarsi_invalid_parameter: "yes"
  tasks:
    - name: "Reading the valid configuration before invalid transaction"
      ansible.builtin.slurp:
        path: "/etc/dovecot/conf.d/99-idarsi.conf"
      register: dovecot_valid_configuration_before_invalid

    - name: "Expecting invalid configuration transaction to fail closed"
      block:
        - name: "Applying an intentionally invalid Dovecot configuration"
          ansible.builtin.include_role:
            name: ansible-iac-role-dovecot
            tasks_from: configuration_present.yml
          vars:
            dovecot_configuration: "{{ dovecot_invalid_configuration }}"
        - name: "Rejecting unexpectedly accepted invalid configuration"
          ansible.builtin.fail:
            msg: "Invalid Dovecot configuration was accepted"
      rescue:
        - name: "Reading configuration after rejected transaction"
          ansible.builtin.slurp:
            path: "/etc/dovecot/conf.d/99-idarsi.conf"
          register: dovecot_configuration_after_invalid
        - name: "Checking rejected transaction artifacts"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "/etc/dovecot/conf.d/99-idarsi.conf.candidate"
            - "/etc/dovecot/conf.d/99-idarsi.conf.previous"
          register: dovecot_invalid_transaction_artifacts
        - name: "Asserting invalid transaction preserved the live file"
          ansible.builtin.assert:
            that:
              - dovecot_configuration_after_invalid.content == dovecot_valid_configuration_before_invalid.content
              - dovecot_invalid_transaction_artifacts.results | map(attribute='stat.exists') | list == [false, false]
            fail_msg: "Invalid Dovecot configuration changed the live managed file"

- name: "Verify failed pre-configuration convergence is recoverable"
  hosts: all
  become: false
  vars:
    state: "present"
    iac_blueprint:
      dovecot:
        configuration:
          protocols:
            - imap
          mail_location: "maildir:/var/lib/dovecot-mail/%d/%n"
          auth_mechanisms:
            - plain
          disable_plaintext_auth: true
          ssl: "no"
  tasks:
    - name: "Expecting convergence to fail before configuration_present"
      block:
        - name: "Running convergence with an unavailable package"
          ansible.builtin.include_role:
            name: ansible-iac-role-dovecot
          vars:
            dovecot_package: "dovecot-package-that-does-not-exist"
        - name: "Rejecting unexpectedly successful failed-run fixture"
          ansible.builtin.fail:
            msg: "The unavailable package unexpectedly converged"
      rescue:
        - name: "Checking failed-run snapshot cleanup"
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "/etc/dovecot/conf.d/99-idarsi.conf.previous"
            - "/etc/dovecot/conf.d/99-idarsi.conf.previous.idarsi-managed"
          register: dovecot_failed_run_snapshot_artifacts
        - name: "Asserting failed-run snapshot does not block recovery"
          ansible.builtin.assert:
            that:
              - dovecot_failed_run_snapshot_artifacts.results | map(attribute='stat.exists') | list == [false, false]
            fail_msg: "Failed convergence left a pre-run snapshot that can block recovery"

    - name: "Rerunning convergence after the expected failure"
      ansible.builtin.include_role:
        name: ansible-iac-role-dovecot

    - name: "Checking recovered convergence snapshot cleanup"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/etc/dovecot/conf.d/99-idarsi.conf.previous"
        - "/etc/dovecot/conf.d/99-idarsi.conf.previous.idarsi-managed"
      register: dovecot_recovered_snapshot_artifacts

    - name: "Asserting successful rerun completed without stale snapshot state"
      ansible.builtin.assert:
        that:
          - dovecot_recovered_snapshot_artifacts.results | map(attribute='stat.exists') | list == [false, false]

- name: "Exercise repeated direct configuration_present transactions"
  hosts: all
  become: false
  vars:
    state: "configuration_present"
    dovecot_test_reload_counter_path: "/tmp/dovecot-direct-configuration-reload-counter"
    iac_blueprint:
      dovecot:
        configuration:
          protocols:
            - "imap"
          mail_location: "maildir:/var/lib/dovecot-mail/%d/%n"
          auth_mechanisms:
            - "plain"
          disable_plaintext_auth: true
          ssl: "no"
          extra_parameters:
            login_greeting: "Direct configuration transaction one."
  tasks:
    - name: "Initializing the direct configuration reload counter"
      ansible.builtin.copy:
        dest: "{{ dovecot_test_reload_counter_path }}"
        content: "0\n"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: "Running the first direct configuration_present invocation"
      ansible.builtin.include_role:
        name: "ansible-iac-role-dovecot"

    - name: "Changing the direct configuration between invocations"
      ansible.builtin.set_fact:
        iac_blueprint:
          dovecot:
            configuration:
              protocols:
                - "imap"
              mail_location: "maildir:/var/lib/dovecot-mail/%d/%n"
              auth_mechanisms:
                - "plain"
              disable_plaintext_auth: true
              ssl: "no"
              extra_parameters:
                login_greeting: "Direct configuration transaction two."

    - name: "Running the second direct configuration_present invocation"
      ansible.builtin.include_role:
        name: "ansible-iac-role-dovecot"

    - name: "Reading the direct configuration reload counter"
      ansible.builtin.slurp:
        src: "{{ dovecot_test_reload_counter_path }}"
      register: dovecot_direct_configuration_reload_counter

    - name: "Asserting repeated direct invocations each reloaded Dovecot"
      ansible.builtin.assert:
        that:
          - (dovecot_direct_configuration_reload_counter.content | b64decode | trim) == "2"
        fail_msg: "Repeated configuration_present invocations did not each notify and reload"
