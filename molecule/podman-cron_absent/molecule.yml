---
dependency:
  name: galaxy
  options:
    collections-path: "${MOLECULE_EPHEMERAL_DIRECTORY}/collections"

driver:
  name: podman

platforms:
  - name: instance-idarsi-cron-absent
    image: docker.io/rockylinux/rockylinux:9-ubi-init
    command: /sbin/init
    privileged: true
    pre_build_image: true
    systemd: "true"
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "${ANSIBLE_COLLECTIONS_PATH:-~/.ansible/collections}:${MOLECULE_EPHEMERAL_DIRECTORY}/collections"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."

verifier:
  name: ansible
